# Database is Neon (neon.tech), not Render's own Postgres: Render's account-wide
# free-tier Postgres slot is already used by an unrelated project. DATABASE_URL
# is set directly on the service (see Render dashboard / `render services update`)
# rather than via `fromDatabase`, since the database isn't provisioned by Render.
services:
  - type: web
    name: cookbook-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SECURE_COOKIES
        value: "true"
