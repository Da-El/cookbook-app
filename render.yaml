databases:
  # Named distinctly from "cookbook-db" - that name is already taken on this
  # Render account by an unrelated project (Da-El/grok-cookbook).
  - name: cookbook-app-db
    databaseName: cookbook_app
    plan: free

services:
  - type: web
    name: cookbook-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cookbook-app-db
          property: connectionString
      - key: SECURE_COOKIES
        value: "true"
