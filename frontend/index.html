<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D9542B" />

    <!-- Default social-share preview, including the page <title>. The
         backend swaps this whole block for page-specific tags when serving
         a meal/ingredient/guide URL directly (see backend/src/og.rs), so a
         link pasted into Slack or iMessage shows that recipe's own name,
         photo and description instead of the app's generic tagline. -->
    <!--OG-META-START-->
    <title>Cookbook</title>
    <meta name="description" content="Follow chefs, build your cookbook, cook from your fridge." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cookbook" />
    <meta property="og:title" content="Cookbook" />
    <meta property="og:description" content="Follow chefs, build your cookbook, cook from your fridge." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <!--OG-META-END-->

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">

    <!-- iOS "Add to Home Screen": without these it opens as a Safari tab
         with browser chrome instead of a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cookbook" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
